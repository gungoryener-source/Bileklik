name: Test portalı

# Test portalının çalışır paketini portal-deploy dalına yazar: derlenmiş
# portal sunucusu, portala bağlı uygulamanın web sürümü ve açılış sayfası.
# Render bu dalı izler; her güncellemede yeniden yayına alır.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Arapça yazı tipi (yalnızca web)
        run: |
          curl -fsSL -o assets/fonts/NotoSansArabic-Regular.ttf https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSansArabic/hinted/ttf/NotoSansArabic-Regular.ttf
          curl -fsSL -o assets/fonts/NotoSansArabic-Bold.ttf https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSansArabic/hinted/ttf/NotoSansArabic-Bold.ttf
          python3 - <<'PY'
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          s = s.replace('  fonts:\n', '  fonts:\n    - family: Noto Sans Arabic\n      fonts:\n        - asset: assets/fonts/NotoSansArabic-Regular.ttf\n        - asset: assets/fonts/NotoSansArabic-Bold.ttf\n          weight: 700\n', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - name: Uygulama (web, portala bağlı)
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --pwa-strategy=none \
            --dart-define=PORTAL_URL=same-origin
          find build/web -name '*.symbols' -delete
      - name: Portal sunucusu
        working-directory: portal
        run: |
          dart pub get
          dart compile exe bin/server.dart -o ../server
      - name: Paketi birleştir
        run: |
          mkdir -p pkg/site
          cp server deploy/Dockerfile deploy/render.yaml pkg/
          cp deploy/index.html pkg/site/
          cp -r build/web pkg/site/uygulama
          du -sh pkg
      - name: portal-deploy dalına yaz
        run: |
          cp -r pkg /tmp/pkg
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan portal-deploy
          git rm -rfq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/pkg/. .
          git add -A
          git commit -qm "Test portalı: ${GITHUB_SHA::7}"
          git push -f origin HEAD:portal-deploy
