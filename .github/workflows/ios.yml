name: iOS

# iOS derlemesi macOS sanal makinesinde (depo herkese açık olduğu için
# GitHub dakikaları ücretsiz).
#
# Her çalışmada (imza gerekmeden):
#   1. Simülatör derlemesi demo kipinde (sahte bileklik) simülatörde açılır;
#      uygulama 30 sn sonra hâlâ çalışıyorsa geçer, ekran görüntüsü alınır.
#   2. Aynısı gerçek kipte (BLE açık; simülatörde Bluetooth yok, uygulama
#      çökmemeli).
#   3. Telefon için yayın derlemesi imzasız (--no-codesign); kod telefon
#      mimarisinde derleniyor mu diye. İmzasız .ipa telefona kurulamaz.
#
# İmza ve TestFlight: depo ayarlarında (Settings > Secrets and variables >
# Actions) şu gizli değerler varsa imzalı .ipa üretilir ve TestFlight'a
# yüklenir. Nasıl alınacağı: docs/ios-canli.md
#   IOS_DIST_CERT_P12_BASE64     Apple Distribution sertifikası (.p12, base64)
#   IOS_DIST_CERT_PASSWORD       .p12 parolası
#   IOS_PROVISION_PROFILE_BASE64 App Store provisioning profile (base64)
#   APP_STORE_CONNECT_KEY_ID     App Store Connect API anahtar kimliği
#   APP_STORE_CONNECT_ISSUER_ID  API anahtarının Issuer ID'si
#   APP_STORE_CONNECT_PRIVATE_KEY  .p8 dosyasının içeriği (olduğu gibi)
# İsteğe bağlı: IOS_MAPS_API_KEY (iOS'a kısıtlı Google Haritalar anahtarı).
on:
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-36j5mc, claude/project-thread-cd15lr]
    paths:
      - lib/**
      - ios/**
      - assets/**
      - pubspec.*
      - .github/workflows/ios.yml

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.bileklik.bileklik
  # Uygulama konumu yalnızca açıkken ister. geolocator'ın "her zaman" izni
  # çağrısını derlemeden çıkarır; yoksa App Store yüklemesi ITMS-90683 ile
  # NSLocationAlwaysAndWhenInUseUsageDescription ister (Swift Package
  # Manager yolu; CocoaPods yolu Podfile'da).
  BYPASS_PERMISSION_LOCATION_ALWAYS: '1'

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # App Store'a yükleme en güncel Xcode/iOS SDK'sını ister.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          # android.yml ile aynı sürüm.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get

      # Portal adresi (PORTAL_URL depo değişkeni) varsa uygulama gerçek
      # sunucuya bağlanır: aile grupları ve davet kodları iki telefon
      # arasında çalışır. Yoksa topluluk ve bağlantılar sahte sunucuyla.
      - name: Portal adresi (varsa)
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          if [ -z "$PORTAL_URL" ]; then
            echo "PORTAL_DEFINE=" >> "$GITHUB_ENV"
            echo "::notice::PORTAL_URL yok; topluluk sahte sunucuyla çalışır."
          elif echo "$PORTAL_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$'; then
            echo "PORTAL_DEFINE=--dart-define=PORTAL_URL=$PORTAL_URL" >> "$GITHUB_ENV"
          else
            echo "::error::PORTAL_URL https:// ile başlayan bir adres olmalı."
            exit 1
          fi

      - name: Harita anahtarı (varsa)
        env:
          IOS_MAPS_API_KEY: ${{ secrets.IOS_MAPS_API_KEY }}
        run: |
          if [ -n "$IOS_MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY = $IOS_MAPS_API_KEY" > ios/Flutter/Secrets.xcconfig
            echo "MAPS_DEFINE=--dart-define=GOOGLE_MAPS=true" >> "$GITHUB_ENV"
          else
            echo "MAPS_DEFINE=--dart-define=GOOGLE_MAPS=false" >> "$GITHUB_ENV"
            echo "::notice::IOS_MAPS_API_KEY yok; harita yerine çizilmiş zemin."
          fi

      - name: Simülatör seç ve aç
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devs = json.load(sys.stdin)["devices"]
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for k in sorted(devs, key=ver, reverse=True):
              if "iOS" not in k:
                  continue
              for d in devs[k]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("iPhone simülatörü yok")
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Simülatör derlemesi (demo kipi)
        run: flutter build ios --simulator --debug --dart-define=DEMO=true $MAPS_DEFINE

      - name: Simülatörde aç (demo kipi)
        run: tool/ios_sim_smoke.sh "$UDID" demo

      - name: Simülatör derlemesi (gerçek kip, BLE)
        run: flutter build ios --simulator --debug $MAPS_DEFINE

      - name: Simülatörde aç (gerçek kip)
        run: tool/ios_sim_smoke.sh "$UDID" gercek

      - name: Telefon derlemesi (imzasız)
        run: |
          flutter build ios --release --no-codesign $MAPS_DEFINE $PORTAL_DEFINE \
            --build-number=${{ github.run_number }} \
            --build-name=0.1.${{ github.run_number }}
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "bileklik-ios-0.1.${{ github.run_number }}-imzasiz.ipa" Payload

      - name: İmza (gizli değerler varsa)
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "SIGNING=yok" >> "$GITHUB_ENV"
            echo "::notice::iOS imza gizli değerleri yok; imzalı .ipa ve TestFlight atlandı (docs/ios-canli.md)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/imza.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dagitim.p12"
          security import "$RUNNER_TEMP/dagitim.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          PROFILE="$RUNNER_TEMP/uygulama.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profil.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print $1" "$RUNNER_TEMP/profil.plist"; }
          UUID=$(pb UUID)
          NAME=$(pb Name)
          TEAM=$(pb TeamIdentifier:0)
          APP_ID=$(pb Entitlements:application-identifier)
          if [ "$APP_ID" != "$TEAM.$BUNDLE_ID" ]; then
            echo "::error::Profil $APP_ID için; uygulama $TEAM.$BUNDLE_ID. App Store profilini bu Bundle ID ile oluşturun."
            exit 1
          fi
          pb Entitlements:com.apple.developer.healthkit > /dev/null || {
            echo "::error::Profilde HealthKit yok. App ID'de HealthKit'i açıp profili yeniden oluşturun."
            exit 1
          }
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$UUID.mobileprovision"
          done

          # Yalnızca Runner hedefi Release.xcconfig'i okur; Pods etkilenmez.
          cat > ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM
          PROVISIONING_PROFILE_SPECIFIER = $NAME
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          EOF

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          echo "SIGNING=appstore" >> "$GITHUB_ENV"

      - name: İmzalı .ipa
        if: env.SIGNING == 'appstore'
        run: |
          flutter build ipa --release $MAPS_DEFINE $PORTAL_DEFINE \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --build-number=${{ github.run_number }} \
            --build-name=0.1.${{ github.run_number }}
          cp build/ios/ipa/*.ipa "bileklik-ios-0.1.${{ github.run_number }}.ipa"

      - name: TestFlight'a yükle
        if: env.SIGNING == 'appstore'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::notice::App Store Connect API anahtarı yok; .ipa yalnızca çıktı olarak saklandı."
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            -f "bileklik-ios-0.1.${{ github.run_number }}.ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "::notice::TestFlight'a yüklendi: 0.1.${{ github.run_number }}. App Store Connect işledikten sonra (10-30 dk) TestFlight uygulamasında görünür."

      - name: Anahtarları temizle
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/imza.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dagitim.p12" ios/Flutter/Signing.xcconfig ios/Flutter/Secrets.xcconfig
          rm -rf "$HOME/.appstoreconnect"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bileklik-ios-${{ github.run_number }}
          path: |
            ios-sim/
            bileklik-ios-*.ipa
          if-no-files-found: warn
