name: Android APK

# Telefona elle yüklenecek yayın (release) APK'sı. Her çalışmada bir GitHub
# sürümü (pre-release) açılır; telefondan o sayfadaki .apk indirilip kurulur.
#
# İmza: depo ayarlarında (Settings > Secrets and variables > Actions) şu gizli
# değerler varsa gerçek yükleme anahtarıyla imzalanır ve Google Play için
# .aab de üretilir:
#   ANDROID_KEYSTORE_BASE64   (jks dosyasının base64 hali)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Yoksa depodaki deneme anahtarıyla imzalanır (android/deneme-imza); deneme
# sürümleri birbirinin üstüne güncellenebilir, ama Play'e yüklenemez.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-36j5mc]
    paths:
      - lib/**
      - android/**
      - assets/**
      - pubspec.*
      - .github/workflows/android.yml

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # Proje Flutter 3.47 ile yazıldı; 3.50 material.dart için
          # kullanımdan kalkma bilgisi verir ve analyze kırmızı olur.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter test

      - name: Yükleme anahtarı (varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "BILEKLIK_KEYSTORE=$RUNNER_TEMP/upload.jks"
              echo "BILEKLIK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "BILEKLIK_KEY_ALIAS=$KEY_ALIAS"
              echo "BILEKLIK_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SIGNING=upload"
            } >> "$GITHUB_ENV"
          else
            echo "SIGNING=deneme" >> "$GITHUB_ENV"
            echo "::notice::Yükleme anahtarı yok; deneme anahtarıyla imzalanıyor."
          fi

      # Google Haritalar anahtarı (MAPS_API_KEY gizli değeri) varsa harita
      # açılır; yoksa uygulama kodla çizilmiş zemini gösterir.
      # Portal adresi (PORTAL_URL depo değişkeni) varsa uygulama gerçek
      # sunucuya bağlanır: aile grupları ve davet kodları iki telefon
      # arasında çalışır. Yoksa topluluk ve bağlantılar sahte sunucuyla.
      - name: Portal adresi (varsa)
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          if [ -z "$PORTAL_URL" ]; then
            echo "PORTAL_DEFINE=" >> "$GITHUB_ENV"
            echo "::notice::PORTAL_URL yok; topluluk sahte sunucuyla çalışır."
          elif echo "$PORTAL_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._/-]*)?$'; then
            echo "PORTAL_DEFINE=--dart-define=PORTAL_URL=$PORTAL_URL" >> "$GITHUB_ENV"
          else
            echo "::error::PORTAL_URL https:// ile başlayan bir adres olmalı."
            exit 1
          fi

      - name: Harita anahtarı (varsa)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> "$GITHUB_ENV"
            echo "MAPS_DEFINE=--dart-define=GOOGLE_MAPS=true" >> "$GITHUB_ENV"
          else
            echo "MAPS_DEFINE=--dart-define=GOOGLE_MAPS=false" >> "$GITHUB_ENV"
            echo "::notice::MAPS_API_KEY yok; harita yerine çizilmiş zemin."
          fi

      # Sürüm kodu her derlemede artar; telefondaki eski sürümün üstüne kurulur.
      - name: APK
        run: |
          flutter build apk --release $MAPS_DEFINE $PORTAL_DEFINE \
            --build-number=${{ github.run_number }} \
            --build-name=0.1.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk \
            "bileklik-0.1.${{ github.run_number }}-$SIGNING.apk"

      - name: Play paketi (yalnızca yükleme anahtarıyla)
        if: env.SIGNING == 'upload'
        run: |
          flutter build appbundle --release $MAPS_DEFINE $PORTAL_DEFINE \
            --build-number=${{ github.run_number }} \
            --build-name=0.1.${{ github.run_number }}
          cp build/app/outputs/bundle/release/app-release.aab \
            "bileklik-0.1.${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: bileklik-android-${{ github.run_number }}
          path: |
            bileklik-*.apk
            bileklik-*.aab
          if-no-files-found: error

      - name: GitHub sürümü (telefondan indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-0.1.${{ github.run_number }}
          name: Android deneme 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Dal: ${{ github.ref_name }} (${{ github.sha }})
            İmza: ${{ env.SIGNING }}
            Telefonda bu sayfadan .apk dosyasını indirip açın. Kurulum adımları:
            docs/android-canli.md
          files: |
            bileklik-*.apk
            bileklik-*.aab
