name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # GEÇİCİ: ekran görüntülerini ekran-goruntuleri dalına yazar.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Arapça yazı tipi
        run: |
          mkdir -p build
          curl -fsSL -o build/NotoSansArabic.ttf https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSansArabic/hinted/ttf/NotoSansArabic-Regular.ttf || true
      - name: Ekran görüntüleri
        run: |
          set -o pipefail
          export FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          EKRAN=1 flutter test --update-goldens --reporter expanded test/ekran_goruntusu_test.dart 2>&1 | tee shot.txt
      - name: Hatalar
        if: failure()
        run: |
          python3 - <<'PY'
          lines = open('shot.txt', encoding='utf-8', errors='replace').read().splitlines()
          marks = [i for i, l in enumerate(lines) if '[E]' in l]
          for n, i in enumerate(marks[:8]):
              chunk = '\n'.join(lines[max(0, i - 60):i + 12])[-3800:]
              msg = chunk.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=shot{n}::{msg}')
          PY
      - name: Görüntüleri dala yaz
        if: always()
        run: |
          ls -la test/ekran || exit 0
          mkdir -p /tmp/ekran && cp -r test/ekran/. /tmp/ekran/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ekran-goruntuleri
          git rm -rfq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/ekran/. .
          git add -A
          git commit -qm "Ekran görüntüleri"
          git push -f origin HEAD:ekran-goruntuleri
