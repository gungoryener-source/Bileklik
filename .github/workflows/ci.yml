name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # GEÇİCİ: analiz ve test çıktısını açıklama olarak yazar.
      - name: flutter analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.txt || true
      - name: flutter test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-output.txt
      - name: Hatalar
        if: always()
        run: |
          python3 - <<'PY'
          import os
          def emit(title, chunk):
              msg = chunk[-3800:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={title}::{msg}')
          if os.path.exists('analyze.txt'):
              a = [l for l in open('analyze.txt', errors='replace').read().splitlines() if ' • ' in l]
              if a: emit('analyze', '\n'.join(a[:40]))
          if os.path.exists('test-output.txt'):
              lines = open('test-output.txt', encoding='utf-8', errors='replace').read().splitlines()
              marks = [i for i, l in enumerate(lines) if '[E]' in l]
              for n, i in enumerate(marks[:8]):
                  emit(f'fail{n}', '\n'.join(lines[max(0, i - 70):i + 12]))
          PY

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: dart test
        run: |
          set -o pipefail
          dart test --reporter expanded 2>&1 | tee test-output.txt
      - name: Hatalar
        if: failure()
        run: |
          python3 - <<'PY'
          lines = open('test-output.txt', encoding='utf-8', errors='replace').read().splitlines()
          marks = [i for i, l in enumerate(lines) if '[E]' in l]
          for n, i in enumerate(marks[:8]):
              chunk = '\n'.join(lines[max(0, i - 60):i + 12])[-3800:]
              msg = chunk.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=pfail{n}::{msg}')
          PY
