name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze-output.txt
      # GEÇİCİ: analiz bulgularını açıklama olarak yazar.
      - name: Analiz bulguları
        if: failure()
        run: |
          python3 - <<'PY'
          for l in open('analyze-output.txt', encoding='utf-8', errors='replace'):
              if ' • ' in l or 'rror' in l:
                  print('::error title=analyze::' + l.strip().replace('%', '%25'))
          PY
      - run: flutter test

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
