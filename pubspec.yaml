name: bileklik
description: "JCV8 bileklik için iOS ve Android sağlık uygulaması."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  # Ticari kullanım ücretli lisans ister; şimdilik License.nonprofit
  # (lib/device/ble_transport.dart).
  flutter_blue_plus: ^2.3.14
  flutter_localizations:
    sdk: flutter
  health: ^13.3.2
  http: ^1.5.0
  intl: ^0.20.2
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2

dev_dependencies:
  # Testlerde uygulama gerçek portal API'siyle (bellekte) konuşur.
  bileklik_portal:
    path: portal
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shelf: ^1.4.2
  sqflite_common_ffi: ^2.4.4

flutter:
  generate: true
  uses-material-design: true

  # Manrope (SIL Open Font License 1.1, assets/fonts/Manrope-OFL.txt).
  # Arapça harfleri yok; Arapça metin sistem fontuna düşer.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
  assets:
    - assets/fonts/Manrope-OFL.txt
